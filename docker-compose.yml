# Contrail — live flight tracking
# Usage: cp .env.example .env  (edit keys)  → docker compose up --build
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contrail}
      POSTGRES_DB: ${POSTGRES_DB:-contrail}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/zz-contrail.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contrail} -d ${POSTGRES_DB:-contrail}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-contrail}:${POSTGRES_PASSWORD:-contrail}@db:5432/${POSTGRES_DB:-contrail}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${WEB_PORT:-3000}}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_MAPTILER_KEY: ${VITE_MAPTILER_KEY:-}
        VITE_CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN:-}
    depends_on:
      - server
    ports:
      - "${WEB_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  dbdata:
